    <script>
      (function () {
        // AI Studio runtime constraint: HMR is disabled in this environment.
        // Intercept Vite HMR WebSocket so that createWebSocketModuleRunnerTransport resolves cleanly without errors.
        var OrigWebSocket = window.WebSocket;
        if (typeof OrigWebSocket !== 'undefined') {
          function ViteMockWebSocket(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            var urlStr = String(url || '');
            // Strictly match ONLY the Vite HMR internal transport protocol ('vite-hmr')
            if (
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              protoStr.includes('vite-hmr')
            ) {
              var listeners = {};
              return {
                url: urlStr,
                protocol: 'vite-hmr',
                readyState: 1, // WebSocket.OPEN
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                send: function () {},
                close: function () {},
                addEventListener: function (type, listener) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(function () {
                      try {
                        listener({ type: 'open' });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function (type, listener) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function (l) { return l !== listener; });
                  }
                },
                dispatchEvent: function () { return true; }
              };
            }
            return new OrigWebSocket(url, protocols);
          }
          ViteMockWebSocket.prototype = OrigWebSocket.prototype;
          ViteMockWebSocket.CONNECTING = 0;
          ViteMockWebSocket.OPEN = 1;
          ViteMockWebSocket.CLOSING = 2;
          ViteMockWebSocket.CLOSED = 3;
          window.WebSocket = ViteMockWebSocket;
        }

        // Prevent any remaining Vite HMR WebSocket connection errors from bubbling up to error overlays
        var origConsoleError = console.error;
        console.error = function () {
          var firstArg = arguments[0];
          var msg = typeof firstArg === 'string' ? firstArg : (firstArg && (firstArg.message || firstArg.stack)) || '';
          if (
            msg.includes('createWebSocketModuleRunnerTransport') ||
            (msg.includes('WebSocket closed without opened') && msg.includes('@vite/client')) ||
            (msg.includes('[vite]') && (msg.includes('connect') || msg.includes('websocket') || msg.includes('WebSocket') || msg.includes('Direct')))
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function (event) {
          var src = event && event.filename ? String(event.filename) : '';
          var msg = event && event.message ? String(event.message) : '';
          var stack = event && event.error && event.error.stack ? String(event.error.stack) : '';
          if (
            src.includes('@vite/client') &&
            (msg.includes('WebSocket') || stack.includes('createWebSocketModuleRunnerTransport') || msg.includes('createWebSocketModuleRunnerTransport'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason ? String(event.reason.message || event.reason.stack || event.reason) : '';
          if (
            reason.includes('createWebSocketModuleRunnerTransport') ||
            (reason.includes('WebSocket closed without opened') && reason.includes('vite'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
