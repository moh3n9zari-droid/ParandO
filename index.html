    <script>
      (function () {
        // Runtime environment constraint: HMR is disabled in this environment. Ignore WebSocket / HMR transport errors.
        var origConsoleError = console.error;
        console.error = function () {
          var firstArg = arguments[0];
          var msg = typeof firstArg === 'string' ? firstArg : (firstArg && (firstArg.message || firstArg.stack)) || '';
          if (
            msg.includes('[vite]') ||
            msg.includes('WebSocket') ||
            msg.includes('createWebSocketModuleRunnerTransport') ||
            msg.includes('vite:ws')
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function (event) {
          var msg = event && event.message ? String(event.message) : '';
          var src = event && event.filename ? String(event.filename) : '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('createWebSocketModuleRunnerTransport') ||
            msg.includes('vite') ||
            src.includes('@vite/client')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason ? String(event.reason.message || event.reason.stack || event.reason) : '';
          if (
            reason.includes('WebSocket') ||
            reason.includes('createWebSocketModuleRunnerTransport') ||
            reason.includes('vite')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
